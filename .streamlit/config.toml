[theme]
base = "light"
primaryColor = "#b45309"
backgroundColor = "#fafaf9"
secondaryBackgroundColor = "#f1efeb"
textColor = "#1c1917"
borderColor = "#e2ded6"
dataframeHeaderBackgroundColor = "#ece8e0"
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.6rem"
redColor = "#b91c1c"
orangeColor = "#b45309"
yellowColor = "#a16207"
greenColor = "#15803d"
blueColor = "#1d4ed8"
violetColor = "#6d28d9"

[theme.sidebar]
backgroundColor = "#24262b"
secondaryBackgroundColor = "#30333a"
textColor = "#e7e5e4"
borderColor = "#3b3f46"
primaryColor = "#f59e0b"

[server]
port = 8080
address = "0.0.0.0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
